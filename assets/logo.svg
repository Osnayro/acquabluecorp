<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="100%" height="100%">
  <defs>
    <!-- Drop Outer Gradient -->
    <linearGradient id="dropBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0056b3"/>
      <stop offset="100%" stop-color="#071a3d"/>
    </linearGradient>

    <!-- Drop Body Gradient -->
    <linearGradient id="dropFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0099e6"/>
      <stop offset="80%" stop-color="#0052a3"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>

    <!-- Chrome Silver Gradient for 'Ac' -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>

    <!-- Cyan/Blue Glass Gradient for 'Qua' -->
    <linearGradient id="quaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Drop Highlight Wave -->
    <linearGradient id="waveHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#001a4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ================= WATER DROP ICON ================= -->
  <g transform="translate(6, 6)" filter="url(#softGlow)">
    <!-- Outer Border -->
    <path d="M 38 4 C 38 4 68 46 68 64 C 68 81 54.5 94 38 94 C 21.5 94 8 81 8 64 C 8 46 38 4 38 4 Z" 
          fill="url(#dropFill)" stroke="url(#dropBorder)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Wave Inner Shape -->
    <path d="M 12 64 C 12 76 21 86 38 86 C 55 86 64 76 64 64 C 64 58 58 52 48 56 C 36 60 28 50 20 54 C 15 56 12 60 12 64 Z" 
          fill="url(#waveHighlight)"/>

    <!-- Specular Gloss Highlight -->
    <ellipse cx="28" cy="30" rx="6" ry="12" transform="rotate(-25 28 30)" fill="#ffffff" opacity="0.65"/>
    <circle cx="21" cy="46" r="3" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- 'Ac' in Chrome Outline Style -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="700">
    <text x="82" y="70" font-size="62" fill="url(#chromeGrad)" stroke="#475569" stroke-width="1.2" letter-spacing="-1">Ac</text>
    
    <!-- 'Qua' in Gradient Cyan/Blue with Custom Stylized Q -->
    <text x="162" y="70" font-size="62" fill="url(#quaGrad)" stroke="#0369a1" stroke-width="1.2" letter-spacing="-1.5">Qua</text>
    
    <!-- 'Blue' in Deep Solid Navy -->
    <text x="290" y="70" font-size="58" font-family="'Georgia', serif" font-weight="800" fill="#002b66" letter-spacing="-0.5">Blue</text>
  </g>

  <!-- ================= SUBTITLES ================= -->
  <!-- 'International Corp.' -->
  <text x="84" y="89" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-weight="800" font-size="14" fill="#001f5c" letter-spacing="0.5">
    International Corp.
  </text>
  
  <!-- 'FL. U.S.A' -->
  <text x="84" y="103" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="700" font-size="11" fill="#0f172a" letter-spacing="1.5">
    FL. U.S.A
  </text>
</svg>
